<head>

    <link rel="stylesheet" href="style.css">

    <style>

            display:flex;
            justify-content:center;
            align-items:center;

            background:#f5f5f5;
            font-family:Arial;
        }

        .success-box{

            background:white;
            padding:40px;

        }

        .success-box a{

            border-radius:8px;

        }

<body>

<div class="success-box">

    <h1>✅ Payment Successful</h1>
